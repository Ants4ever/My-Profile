<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile · Tegar Gunawan</title>
    <!-- Font Awesome 6 -->

    <!-- CSS Eksternal -->

</head>
<body>

<div class="profile-card">

    <!-- header: avatar + nama + email + social -->
    <div class="profile-header">
        <div class="avatar">
        <img src="Picture/Aku.jpg"></i>
        </div>
        <div class="name-section">

            <div class="email-row">
                <i class="fas fa-envelope"></i> tegargunawan@gmail.com
            </div>
            <div class="social-row">
                <a href="https://www.facebook.com/profile.php?id=100068064221809" target="_blank" title="Facebook">
                    <i class="fab fa-facebook"></i> Facebook
                </a>
                <a href="https://www.instagram.com/tegargunawan09?igsh=ZzI0bHNzenE0dDY4" target="_blank" title="Instagram">

                </a>
            </div>

    <!-- 3 kolom: Prestasi, Hard Skill, Organization -->

        <div class="desc-item">
            <span class="label"><i class="fas fa-trophy"></i> PRESTASI</span>

        </div>
        <div class="desc-item">
            <span class="label"><i class="fas fa-code"></i> HARD SKILL</span>

        </div>
        <div class="desc-item">
            <span class="label"><i class="fas fa-users"></i> ORGANIZATION</span>

        </div>
    </div>

    <!-- konten akan diisi sendiri oleh user -->
</div>
